[project]
name = "korean-normalizer"
version = "0.1.0"
description = "한국어 AI 작문 패턴의 규칙 기반 검출·교정"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
pos = ["kiwipiepy>=0.20"]

[project.scripts]
korean-normalizer = "korean_normalizer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/korean_normalizer"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # bugbear
  "A",    # builtin shadowing
  "C4",   # comprehensions
  "SIM",  # simplify
  "PTH",  # pathlib
  "RET",  # return
  "ARG",  # unused arguments
  "PT",   # pytest style
  "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# 이 도구는 한국어 문장부호를 다루므로 테스트에 en-dash·em-dash가 그대로 들어간다.
"tests/*" = ["ARG", "RUF001"]
