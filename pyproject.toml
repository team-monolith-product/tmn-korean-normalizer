[project]
name = "korean-normalizer"
version = "0.1.0"
description = "한국어 AI 작문 패턴의 규칙 기반 검출·교정"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
pos = ["kiwipiepy>=0.20"]

[project.scripts]
korean-normalizer = "korean_normalizer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/korean_normalizer"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src"]
